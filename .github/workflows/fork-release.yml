# Author: Jamius Siam
# Since: 06/11/2026

name: "Fork Release"

# Builds this fork's Linux .deb and Windows x64 NSIS installer into a draft
# release, with updater signatures and latest.json.
# Updates are signed with TAURI_SIGNING_PRIVATE_KEY from the repository
# secrets. The fork has no Authenticode certificate, so the Windows bundles
# are built unsigned by dropping tauri.conf.json's Azure signCommand.

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Build .deb on 22.04, as upstream does
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: >-
              --bundles nsis
              --config '{"bundle":{"windows":{"signCommand":null}}}'
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # Passes the updater signing key; the Apple and Azure secrets it also
      # reads are unset in this fork, and no macOS job runs.
      sign-binaries: true
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
      fast-release: true
    secrets: inherit
